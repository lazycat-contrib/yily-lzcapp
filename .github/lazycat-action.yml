version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/yily.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: yily

build:
  toolchains: []
  run_buildscript: false

images:
  - id: yily
    target: service
    service: yily
    source: yannick2009/yily
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+.*$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: yily
    summary: "yily 懒猫微服打包：轻量自托管密钥管理应用，MIT，单容器。"
