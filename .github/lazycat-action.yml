name: lazycat
on: [push, workflow_dispatch, repository_dispatch]
permissions:
  contents: read
  packages: read
jobs:
  lazycat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ca-x/lazycat-github-action@v1
        with:
          operation: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operation || 'auto' }}
        env:
          GHCR_MIRROR: ${{ vars.GHCR_MIRROR || 'ghcr.1ms.run' }}
          DOCKER_HUB_MIRROR: ${{ vars.DOCKER_HUB_MIRROR || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
