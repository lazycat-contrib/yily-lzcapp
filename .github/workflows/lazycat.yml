on:
  push:
    branches: [main]
  repository_dispatch:
    types: [lazycat]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [auto, build, publish, release]
        default: auto

jobs:
  lazycat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ca-x/lazycat-github-action@v1
        with:
          operation: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operation || 'auto' }}
        env:
          GHCR_MIRROR: ghcr.1ms.run
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
