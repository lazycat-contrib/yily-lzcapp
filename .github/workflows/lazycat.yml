name: LazyCat LPK Automation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: ca-x/lazycat-github-action@v1
        id: lazycat
        with:
          operation: auto
          ghcr-mirror: ghcr.1ms.run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload LPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpk-package
          path: dist/yily.lpk
