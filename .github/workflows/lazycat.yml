name: LazyCat LPK Automation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: auto, check, build, publish-official, publish-private
        required: false
        default: auto
      version:
        description: Manual SemVer; auto builds when supplied
        required: false
        default: ""

jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      config: .github/lazycat-action.yml
      operation: ${{ inputs.operation || 'auto' }}
      version: ${{ inputs.version || '' }}
    secrets: inherit
