name: LazyCat LPK Automation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  lazycat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ca-x/lazycat-github-action@v1
        id: lazycat
        with:
          operation: auto
          GHCR_MIRROR: ghcr.1ms.run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
