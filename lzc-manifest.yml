application:
  subdomain: yily
  multi_instance: false
  upstreams:
    - location: /
      backend: http://yily:52015
  public_path:
    - /

services:
  yily:
    # 镜像模式：Action 只读校验后改写成加速地址（ghcr.1ms.run）
    image: ghcr.1ms.run/yannick2009/yily:1.0.0-beta.2
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:52015/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "52015:52015"
    environment:
      - YILY_MASTER_KEY={{ stable_secret "yily_master_key" }}
      - YILY_SETUP_TOKEN={{ stable_secret "yily_setup_token" }}
    volumes:
      - yily-data:/data

volumes:
  yily-data:
    type: persist

deployment:
  replicas: 1
