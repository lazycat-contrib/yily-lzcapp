application:
  subdomain: yily
  multi_instance: false
  upstreams:
    - location: /
      backend: http://yily:52015
  public_path:
    - /
services:
  yily:
    # upstream: ghcr.io/yannick2009/yily:1.0.0-beta.2
    image: ghcr.1ms.run/yannick2009/yily:1.0.0-beta.2
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:52015/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - YILY_MASTER_KEY={{ stable_secret "yily_master_key" }}
      - YILY_SETUP_TOKEN={{ stable_secret "yily_setup_token" }}
    binds:
      - /lzcapp/var/yily:/data
usage: |
  yily 是一个轻量自托管的秘密管理应用，全站只有一个 Super Admin 账号。
  首次安装后用 YILY_SETUP_TOKEN 引导创建管理员，然后可关闭注册。
