name: yily
summary: 轻量自托管密钥管理
description: |
  Yily 是一个轻量自托管的秘密管理应用，服务端 Go（Echo + SQLite），前端 SolidJS + Tailwind。
  全站只有一个 Super Admin 账号，没有第三方 IdP、OAuth 或外部 SMTP。

